# Test profile — uses PostgreSQL service container in CI (GitHub Actions)
# and can also be run locally with: docker-compose up postgres
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskmanager_test}
    username: ${DB_USERNAME:testuser}
    password: ${DB_PASSWORD:testpass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop     # recreate schema on each test run
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  flyway:
    enabled: false              # Hibernate manages schema in tests (DDL auto)

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration-ms: 3600000
  refresh-expiration-ms: 86400000

logging:
  level:
    com.deepanshu.taskmanager: WARN
    org.springframework.security: WARN

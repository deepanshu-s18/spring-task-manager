# Test profile — in-memory H2 (PostgreSQL compatibility mode) for zero-dependency tests,
# or overridden via SPRING_DATASOURCE_URL in CI if a Postgres container is provisioned.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:taskmanager_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: create-drop     # recreate schema on each test run
    show-sql: false
  flyway:
    enabled: false              # Hibernate manages schema in tests (DDL auto)

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration-ms: 3600000
  refresh-expiration-ms: 86400000

logging:
  level:
    com.deepanshu.taskmanager: WARN
    org.springframework.security: WARN
